name: Verify local-first app
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks (pinned binary)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --no-banner --redact
  flutter:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-21
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2, verified 2026-10-21
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: python3 tool/scan_secrets.py
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: python3 tool/audit_release.py
      - run: flutter build ios --release --no-codesign
      # No store credentials, original-device tests, upload or publication here.
